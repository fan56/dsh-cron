# dsh-cron bundle patch: mounts the plugin into the profile's assembly tree
# under the stable plugin id `dsh-cron`. The `dsh-cron` entry id doubles as
# the settings namespace (profile-patch config: fireHistoryLimit /
# historyLimit / tickIntervalMs / storageDir); the plugin mounts the
# cron_create/list/delete/report tools on every runtime agent and the /cron
# slash command.

- insert:
    - id: dsh-cron
      name: '@aiwayds/dsh-cron'
